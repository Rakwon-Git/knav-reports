<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Progress Report</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <!--
          LSU-branded staticrypt template (2026-08-17, Mr. K: "make the login look
          less suspicious... LSU colors... tiger stripes in the background").
          Official colors verified against LSU brand guidelines before use:
          Purple PMS 268C #461D7C, Gold PMS 123C #FDD023.
          Tiger stripes are a hand-built CSS diagonal-stripe texture (no image
          asset, no external dependency) — kept subtle behind a clean white
          card so the actual password form still reads as trustworthy, not busy.
        -->
        <style>
            :root {
                --lsu-purple: #461d7c;
                --lsu-purple-dark: #2f1354;
                --lsu-gold: #fdd023;
            }

            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 40px 45px 45px;
                text-align: center;
                border-radius: 4px;
                border-top: 6px solid var(--lsu-gold);
                box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.35), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.04em;
                font-weight: bold;
                outline: 0;
                background: var(--lsu-gold);
                width: 100%;
                border: 0;
                border-radius: 3px;
                padding: 15px;
                color: var(--lsu-purple-dark);
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--lsu-gold);
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            /* Tiger-stripe texture: irregular-width diagonal bands, dark-on-purple,
               kept low-opacity so it reads as texture behind the card, not noise. */
            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background-color: var(--lsu-purple);
                background-image:
                    repeating-linear-gradient(
                        -38deg,
                        rgba(0, 0, 0, 0.4) 0px,
                        rgba(0, 0, 0, 0.4) 22px,
                        transparent 22px,
                        transparent 60px,
                        rgba(0, 0, 0, 0.25) 60px,
                        rgba(0, 0, 0, 0.25) 74px,
                        transparent 74px,
                        transparent 150px
                    ),
                    linear-gradient(180deg, var(--lsu-purple-dark) 0%, var(--lsu-purple) 40%, var(--lsu-purple) 100%);
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
                color: var(--lsu-purple);
                font-weight: bold;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--lsu-purple);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--lsu-gold);
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
